# Optional cloud text-to-speech for NPC voices (plan: elevenlabs-tts-backend).
# Edit and re-run the game; no rebuild needed.
#
# Default is `none`: no audio device is opened, no thread starts, no network
# traffic. The game is byte for byte what it was before this file existed.
#   none        -> NPCs are silent (today's behaviour)
#   elevenlabs  -> NPCs with an entry in config/voices.cfg speak through the
#                  ElevenLabs API; every other NPC, and every failure, is silent
provider = none

# Only the host machine talks to the API; clients in a multiplayer match never
# see the key. Export it before launching:
#   export NPC_GAME_ELEVENLABS_API_KEY=...
# or put `elevenlabs_api_key = ...` in the gitignored config/secrets.cfg.
# Needs a build with OpenSSL (CMake picks it up when installed). Without a key
# the provider drops back to `none` and one log line says so.
# api_key_env = NPC_GAME_ELEVENLABS_API_KEY

# Default model for voices.cfg entries that name none. eleven_flash_v2_5 is the
# low-latency model (~75 ms, 40,000-character limit) per elevenlabs.io/docs/models.
elevenlabs_model = eleven_flash_v2_5

# Audio format requested from the API. Must be pcm_<rate> (raw 16-bit mono,
# wrapped in a WAV header in code) or wav_<rate>; nothing here decodes mp3 or
# opus. 22050 is the cheapest rate that is still clean for speech. PCM/WAV at
# 44100 requires the Pro tier.
elevenlabs_output_format = pcm_22050

# Per-attempt timeout, and the pause before the one retry a 429 / 5xx / timeout
# earns. After that the line is silent.
elevenlabs_timeout_s = 15
elevenlabs_retry_backoff_ms = 750

# Stop spending after this many characters in one session (cache hits are
# free and not counted). 0 = no budget. Once reached, voices are off until the
# next launch and one log line says so.
character_budget = 0

# Synthesized lines are cached here, keyed by text + voice + model + format, so
# a repeated line costs nothing and every player hears the same take. Relative
# paths are from the project root; saves/ is gitignored.
cache_dir = saves/tts_cache
cache_max_mb = 200
