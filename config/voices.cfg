# Which NPCs speak, and in what voice (plan: elevenlabs-tts-backend).
#
# One NPC per group of lines, keyed by the persona's `name` exactly as it
# appears in personas/*.persona (the same id the memory and conversation
# stores use). An NPC with no entry here is silent, exactly as today.
#
#   npc.<name>.voice_id = <ElevenLabs voice id, from the Voices page>
#   npc.<name>.model_id = <optional; defaults to elevenlabs_model in tts.cfg>
#   npc.<name>.backend  = <optional; defaults to elevenlabs>
#
# `#` starts a comment, so a name containing `#` (generated characters such as
# "Jane #47") cannot be given a voice here.
#
# Example (the voice id below is a placeholder, not a real voice):
# npc.Marge Holloway.voice_id = 21m00Tcm4TlvDq8ikWAM
# npc.Marge Holloway.model_id = eleven_flash_v2_5
