# Centralized LLM settings shared by every NPC.
# Edit and re-run the game; no rebuild needed.

host = localhost
port = 11434

# Any Ollama tag works. Pull it first with: ollama pull <model>
model = qwen3:8b

# Reasoning models only: "false" answers at chat speed (qwen3 measured
# 24s -> 2.7s to first token). Remove the line for models without thinking.
think = false

# 0.0 = deterministic. 0.7-0.9 = natural chat. 1.0+ = chaotic.
temperature = 0.8

# How long to wait for a single reply before giving up.
request_timeout_s = 60

# How long Ollama should keep the model resident after the last request.
# Use Go duration syntax (e.g. 30s, 5m, 1h). Longer keeps latency low but
# holds VRAM.
keep_alive = 10m

# World generation (sandbox "Generate...") uses THIS same model. Measured
# winner of tools/bench_schema_models.py (2026-07-14): qwen3:8b, 50% valid
# vs 25%/0% for qwen2.5:3b/gemma3:4b — re-run the bench before changing.

# --- Provider -----------------------------------------------------------------
# Where chat requests go. Default is local Ollama (offline, no key, no TLS).
#   ollama      -> local Ollama at host:port above
#   anthropic   -> Claude Haiku 5.5 via the Anthropic Messages API, with the
#                  Ollama model above as the automatic fallback (no key, bad
#                  key, rate limit, outage, no network, or budget reached)
#   openrouter  -> cloud, one key reaches Claude/GPT/Gemini and 300+ others
#   openai      -> any OpenAI-compatible endpoint (set base_url)
provider = ollama

# OpenAI-compatible base URL (ignored when provider = ollama). Leave blank to
# use OpenRouter's default. Tip: point this at the local Ollama OpenAI shim to
# test the cloud code path with no key and no TLS:
#   base_url = http://localhost:11434/v1
# base_url = https://openrouter.ai/api/v1

# For cloud providers, the model is the provider's id, e.g.:
#   model = anthropic/claude-haiku-4.5      (talk)
#   model = google/gemini-2.5-flash         (cheap)
#   model = openai/gpt-5-mini               (cheapest)

# Name of the environment variable holding your API key. The key itself is read
# from that variable (or from config/secrets.cfg) and is never stored here.
# Unset, it follows the provider: OPENROUTER_API_KEY for openrouter/openai,
# NPC_GAME_ANTHROPIC_API_KEY for anthropic.
# api_key_env = OPENROUTER_API_KEY

# --- Anthropic (provider = anthropic) -----------------------------------------
# Only the host machine talks to the API; clients in a multiplayer match go
# through the host and never see the key. Export it before launching:
#   export NPC_GAME_ANTHROPIC_API_KEY=sk-ant-...
# or put `api_key = sk-ant-...` in the gitignored config/secrets.cfg.
# Needs a build with OpenSSL (CMake picks it up when installed; the test build
# does not need it). Without a key the game runs on Ollama exactly as before
# and logs one line saying so.
#
# Pinned model id. No alias on purpose: an alias can change model under you.
anthropic_model = claude-haiku-5-5

# Output cap per reply. Thinking is disabled on every request so the whole cap
# is visible text; persona style already asks for 1-3 sentences.
anthropic_max_tokens = 200

# How many recent history turns go out with each request. The system prompt is
# sent as one cached block, so a short window keeps the per-turn tail small.
anthropic_history_turns = 12

# Stop spending after this many tokens in one session (input + output + cache
# write + cache read), switching to Ollama. 0 = no budget.
anthropic_token_budget = 0

# Pause before the one retry a 429 / 5xx / timeout earns; then Ollama answers.
anthropic_retry_backoff_ms = 750

# Per-attempt timeout for the cloud call. Deliberately short: a stalled
# request is retried once and then handed to Ollama, so this bounds how long
# the player waits before the local model takes over.
anthropic_timeout_s = 20

# --- Free / Paid tier (simulated wallet) --------------------------------------
# In the in-game menu (AI: Free / Paid), Free answers NPCs with the local model
# and Paid with the Anthropic backend above, charging a prepaid balance per
# reply. Purchases are SIMULATED: "Buy" adds test credits and no money moves;
# your own API key pays Anthropic. The balance lives in saves/wallet.cfg.
#
# What Anthropic charges, USD per million tokens. Claude Haiku 5.5 at prompts of
# 100K tokens or less (NPC prompts are ~1-3K); copied from
# https://platform.claude.com/docs/en/about-claude/pricing — update by hand if
# the model or its prices change. Cache write is the 5-minute rate.
price_input_per_mtok = 0.10
price_output_per_mtok = 0.50
price_cache_write_per_mtok = 0.125
price_cache_read_per_mtok = 0.01

# The margin: a player pays cost x (1 + markup_percent / 100), rounded up to
# the micro-dollar. 40 is an example value.
markup_percent = 40

# Balance a brand-new player starts with, in USD.
starter_credit_usd = 1.00

# --- Line bank ----------------------------------------------------------------
# Authored replies for recurring topics, served locally instead of round-
# tripping to the model (2.7 s TTFT today; see bench/REPORT.md). Content lives
# in banks/*.bank — see banks/README.md.
#
# Stays `off` until a reviewed bank exists (issue #153). Anything other than
# an explicit "on" leaves it off, so a typo disables the feature rather than
# half-enabling it.
line_bank = off

# Confidence a topic match must clear to serve a banked line, 0..1. Higher is
# more conservative: at 0.85 or so only near-exact phrasings hit, which
# collapses the feature to openers-and-small-talk with no code change.
line_bank_threshold = 0.62

# How fast a banked reply is streamed out, characters per second. It has to
# arrive like a generated one — delivering it in a single frame reads as a
# different system. Time-to-first-token stays ~0 either way.
line_bank_cps = 220
