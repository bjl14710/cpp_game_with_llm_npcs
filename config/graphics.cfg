# Visual switches. Edit and re-run, or flip them in-game from the pause
# menu (Esc -> "Noir" / "Rain"), which saves here.

# Neo-Noir night: from dusk the city blends into a rain-slick noir look
# (lamp pools, wet reflective streets, a near-colorless grade where only
# red survives, vignette, film grain). Daytime is never affected.
# off = the original night look.
noir_night = on

# Falling rain during the noir night (has no effect when noir_night = off).
rain = on
